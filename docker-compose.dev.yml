# ===========================================
# Code Audit Platform - Development Override
# ===========================================
# Run with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # ===========================================
  # Backend API - Development Mode
  # ===========================================
  api:
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - repos_data:/app/repos
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/codeaudit
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # ===========================================
  # Frontend - Development Mode (Vite with HMR)
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: code-audit-frontend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Prevents overwriting node_modules in container
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
      - VITE_DEV_MODE=true
      - VITE_PORT=5173
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5172:5173"
    restart: on-failure

  # ===========================================
  # PostgreSQL Database - Development Mode
  # ===========================================
  db:
    image: postgres:16-alpine
    container_name: code-audit-db-dev
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codeaudit
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - code-audit-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codeaudit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Redis - Queue & Cache - Development Mode
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: code-audit-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - code-audit-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # RQ Worker - Development Mode
  # ===========================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: code-audit-worker-dev
    deploy:
      replicas: 1
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - repos_data:/app/repos
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/codeaudit
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - PYTHONPATH=/app
    command: ["python", "-m", "app.workers.worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - code-audit-dev-network

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data_dev:
  redis_data_dev:
  uploads_data:
  repos_data:

# ===========================================
# Networks
# ===========================================
networks:
  code-audit-dev-network:
    driver: bridge
