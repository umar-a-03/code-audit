# A generic, single database configuration for Alembic

[alembic]
# Path to migration scripts
script_location = app/adapters/persistence/migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# Timezone for timestamps in migration files
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# to autogenerate migration scripts
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
# to be detected as revisions in the version/ directory
sourceless = false

# Version location specification (can be multiple entries)
version_locations = %(here)s/versions

# Version path separator (default: os.pathsep)
version_path_separator = os

# The output encoding used when revision files are written
output_encoding = utf-8

# Database URL - overridden by env.py from settings
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/codeaudit


[post_write_hooks]
# Post-write hooks go here

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
